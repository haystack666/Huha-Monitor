services:
  mongodb:
    image: mongo:7.0.8
    container_name: huha-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  control-server:
    build:
      context: .
      dockerfile: apps/control-server/Dockerfile
    container_name: huha-control-server
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      HUHA_HTTP_PORT: 4000
      HUHA_HTTP_HOST: 0.0.0.0
      HUHA_MONGODB_URI: mongodb://mongodb:27017
      HUHA_MONGODB_DB: huha
      HUHA_AGENT_OFFLINE_AFTER_MS: 15000
      HUHA_PUBLIC_SERVER_URL: ws://localhost:4000/ws/agent
      HUHA_PUBLIC_DASHBOARD_WS_URL: ws://localhost:4000/ws/dashboard
      HUHA_PROBE_DOWNLOAD_BASE_URL: http://localhost:4000/downloads/probes
    ports:
      - "4000:4000"

  web-console:
    build:
      context: .
      dockerfile: apps/web-console/Dockerfile
      args:
        VITE_HUHA_API_BASE_URL: http://localhost:4000
        VITE_HUHA_DASHBOARD_WS_URL: ws://localhost:4000/ws/dashboard
    container_name: huha-web-console
    restart: unless-stopped
    depends_on:
      - control-server
    ports:
      - "4173:80"

volumes:
  mongodb_data:
